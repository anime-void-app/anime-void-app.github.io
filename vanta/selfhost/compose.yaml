name: vanta-sovereign
services:
  app:
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8765:8765"
    depends_on:
      - ollama
      - searxng
    restart: unless-stopped
    networks:
      - private
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - private
  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    networks:
      - private
networks:
  private:
    internal: false
volumes:
  ollama_models:
